<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8">
		<title> PlayFair - Home </title>
		<link rel="stylesheet" href="styles.css">
		<script src="apps.js" defer></script>
	</head>
	<body>
		<header class="site-header">
			<p class="brand"> <img src="images/logo.png" alt="PlayFair logo"></p>
			<nav class="nav">
				<ul>
					<li><a href="#myBets" title="View your bets">My Bets</a></li>
					<li><a href="#liveSports" title="View live sports">Live Sports</a></li>
					<li><a href="#rewards" title="View your available rewards">Rewards</a></li>
					<li><a href="#about" title="View our about section">About Us</a></li>
				</ul>
			</nav>
			<hr>
		</header>

		<main aria-label="Main">
			<p class="controls">
				<label for="search">Search by team</label>
				<input id="search" type="search">
					
				<label for="category">Category</label>
				<select id="category">
				<option value="All">All</option>
				<option value="Open">Open</option>
				<option value="Settled">Settled</option>
				</select>
			</p>
			<section id="games">
				<h2>Featured Games</h2>
				<p id="count" role="status"></p>
				<ul id="list" class="cards"></ul>
			</section>
		</main>
		<footer class="footer"> <!-- This needs to be at the bottom of the page -->
			PlayFair&copy;               Contact Us: Email that we never check; social media we don't reply to
			<br>Our Partners:
		</footer>
	</body>
</html>
